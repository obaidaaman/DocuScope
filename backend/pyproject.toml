[project]
name = "analyst-backend"
version = "0.1.0"
description = "The Analyst That Never Sleeps — agentic document analysis backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [

    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.15.2",
    "pgvector==0.3.6",

    "pyjwt==2.10.1",
    "bcrypt==4.3.0",
    "python-multipart==0.0.20",
 
    "pydantic-settings==2.9.1",
 
    "numpy<2.0.0",
    "matplotlib==3.8.4",
    "pdfplumber==0.11.6",
    "python-docx==1.1.2",
    "openai==1.82.0",
    "langchain-openai==0.3.18",
    "langgraph==0.4.7",
    "langgraph-checkpoint-postgres==2.0.18",
    
    "slowapi==0.1.9",
    
    "structlog==25.1.0",
 
    "python-dotenv==1.1.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
    "unstructured-transform-client==0.18.27",
    "supabase>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "httpx>=0.28.1",
]
